<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Shooting Game for History</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            background: black;
        }

        #hint {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            z-index: 10;
        }

        /* MOBILE CONTROLS */
        #shootBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            padding: 20px 30px;
            z-index: 20;
            background: rgba(100, 200, 100, 0.7);
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            display: none;
        }

        #jumpBtn {
            position: fixed;
            bottom: 120px;
            right: 20px;
            font-size: 24px;
            padding: 20px 30px;
            z-index: 20;
            background: rgba(100, 200, 100, 0.7);
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            display: none;
        }

        #joystick-base {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.6);
            border: 5px solid rgba(255, 255, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;

            height: 80px;

</head>

<body>

    <div id="hint">Click to lock mouse • WASD to move • Space to jump • E to shoot • ⚠️ MOAT = DEATH</div>

    <div id="health"
        style="position: fixed; top: 50px; left: 10px; color: white; font-family: sans-serif; background: rgba(0, 0, 0, 0.5); padding: 6px 10px; z-index: 10; font-size: 18px;">
        ❤️ Health: <span id="healthValue">100</span>
    </div>

    <div id="deathMessage"

        YOU DIED
    </div>

    <div id="winMessage"

        function squarePyramid(x, y, z, size, height, color = 0xff0000) {
            // Visual pyramid
            const geometry = new THREE.ConeGeometry(size, height, 4);
            const material = new THREE.MeshStandardMaterial({ color });
            const pyramid = new THREE.Mesh(geometry, material);

            pyramid.position.set(x, y + height / 2, z);
            pyramid.rotation.y = Math.PI / 4;
            scene.add(pyramid);

            // 🔒 Invisible solid blocker
            const blocker = new THREE.Mesh(
                new THREE.BoxGeometry(size * 1.1, height, size * 1.1),
                new THREE.MeshBasicMaterial({ visible: false })
            );

            blocker.position.copy(pyramid.position);
            scene.add(blocker);

            // Make it collide
            colliders.push(blocker);

            return pyramid;
        }

        /* ---- STAIRS ---- */
        // Spiral stairs inside the main tower
        function createSpiralStairs(centerX, centerZ, startY, endY, radius, stepsPerLoop) {
            const totalHeight = endY - startY;
            const stepHeight = 0.3;
            const totalSteps = Math.floor(totalHeight / stepHeight);
            const angleStep = (Math.PI * 2) / stepsPerLoop;
            const stepWidth = 3;
            const stepDepth = 2;

            for (let i = 0; i < totalSteps; i++) {
                const angle = i * angleStep;
                const x = centerX + Math.cos(angle) * radius;
                const z = centerZ + Math.sin(angle) * radius;
                const y = startY + (i * stepHeight);

                // Create the step
                const m = new THREE.Mesh(
                    new THREE.BoxGeometry(stepWidth, stepHeight, stepDepth),
                    new THREE.MeshStandardMaterial({ color: 0x8B4513 }) // Brown wood stairs
                );
                m.position.set(x, y + stepHeight / 2, z);
                m.rotation.y = angle + Math.PI / 2; // Rotate to face center
                scene.add(m);
                colliders.push(m);
            }
        }

        // Create spiral stairs inside the main tower
        // Tower center is at (0, y, -90), radius is about 6 units (inside the 20x20 tower)

        scene.add(archTop);

        // Wooden gate doors

        const gateLeftDoor = new THREE.Mesh(
            new THREE.BoxGeometry(4, 7, 0.5),
            woodMaterial

        gateLeftDoor.position.set(-2, 3.5, 0);
        scene.add(gateLeftDoor);

        const gateRightDoor = new THREE.Mesh(

        scene.add(gateRightDoor);

        // Gate state for animation
        let gateOpen = false;

        // Metal reinforcements on doors

        // Moat bounds - only the outer ring (excluding bridge area)
        function isInMoat(x, y, z) {
            // Bridge safe zone (no drowning on bridge)
            if (z >= 0 && z <= 21 && x >= -6 && x <= 6) return false;

            // North moat
            if (z >= -130 && z <= -110 && x >= -50 && x <= 50) return true;
            // South moat (with bridge gap)
            if (z >= 0 && z <= 20 && x >= -50 && x <= 50) return true;
            // West moat
            if (x >= -55 && x <= -35 && z >= -125 && z <= 15) return true;
            // East moat
            if (x >= 35 && x <= 55 && z >= -125 && z <= 15) return true;

            return false;
        }

        // Check if player is over moat area (for falling in)
        function isOverMoat(x, z) {
            // Bridge safe zone
            if (z >= 0 && z <= 21 && x >= -6 && x <= 6) return false;

            // North moat
            if (z >= -130 && z <= -110 && x >= -50 && x <= 50) return true;
            // South moat (with bridge gap)
            if (z >= 0 && z <= 20 && x >= -50 && x <= 50) return true;
            // West moat
            if (x >= -55 && x <= -35 && z >= -125 && z <= 15) return true;
            // East moat
            if (x >= 35 && x <= 55 && z >= -125 && z <= 15) return true;

            return false;
        }

        // Drowning mechanic
        let timeInWater = 0;
        const drownTime = 3000; // 3 seconds to drown

        /* =====================
           PLAYER
        ===================== */
        const player = {
            position: new THREE.Vector3(0, 1.6, 30),  // Outside castle, facing north to view castle
            yaw: 0,  // Facing north towards castle
            pitch: 0
        };
        camera.position.copy(player.position);

        const playerSize = new THREE.Vector3(0.8, 1.8, 0.8);

        /* Player Health */
        let playerHealth = 100;
        const maxHealth = 100;
        const healthDisplay = document.getElementById('healthValue');
        const deathMessage = document.getElementById('deathMessage');
        const winMessage = document.getElementById('winMessage');
        const killCountDisplay = document.getElementById('killCount');

        /* Kill tracking */
        let totalKills = 0;
        const maxEnemies = 15;

        /* Jump & Swimming */
        let velocityY = 0;
        const gravity = -0.015;
        const jumpStrength = 0.3;
        const groundY = 1.6;
        let onGround = true;
        let isInWater = false;
        let isDrowning = false;

        /* =====================
           INPUT
        ===================== */
        const keys = {};

        addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === "Space" && onGround) {
                velocityY = jumpStrength;
                onGround = false;
            }
        });
        addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        if (!isMobile) {
            document.body.onclick = () => document.body.requestPointerLock();
        }

        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== document.body) return;
            player.yaw -= e.movementX * 0.002;
            player.pitch -= e.movementY * 0.002;
            player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
        });

        /* =====================
           MOBILE CONTROLS
        ===================== */
        const joystickBase = document.getElementById("joystick-base");
        const joystickKnob = document.getElementById("joystick-knob");
        const jumpBtn = document.getElementById("jumpBtn");

        if (isMobile) {
            joystickBase.style.display = "flex";
            jumpBtn.style.display = "block";
            shootBtn.style.display = "block";

            // Force visibility debugging
            console.log("Mobile detected!");
            console.log("Joystick element:", joystickBase);
            console.log("Joystick display:", getComputedStyle(joystickBase).display);

            // Ensure visibility
            setTimeout(() => {
                joystickBase.style.display = "flex";
                joystickBase.style.visibility = "visible";
                jumpBtn.style.display = "block";
                shootBtn.style.display = "block";
                console.log("Joystick forced visible");
            }, 100);
        }

        // Jump button for mobile
        jumpBtn.addEventListener("touchstart", e => {
            e.preventDefault();
            if (onGround) {
                velocityY = jumpStrength;
                onGround = false;
            }
        });

        /* CAMERA ROTATION FOR MOBILE */
        let lastTouchX = 0;
        let lastTouchY = 0;
        let touchRotating = false;

        renderer.domElement.addEventListener("touchstart", e => {
            if (e.touches.length === 1) {
                // Single finger touch for camera rotation
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                touchRotating = true;
            }
        });

        renderer.domElement.addEventListener("touchmove", e => {
            if (touchRotating && e.touches.length === 1) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - lastTouchX;
                const deltaY = touch.clientY - lastTouchY;

                // Update camera rotation (yaw and pitch)
                player.yaw -= deltaX * 0.005;
                player.pitch -= deltaY * 0.005;
                player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            }
        });

        renderer.domElement.addEventListener("touchend", e => {
            if (e.touches.length === 0) {
                touchRotating = false;
            }
        });

        /* JOYSTICK */
        let joyStart = { x: 0, y: 0 }, joyActive = false;
        const maxDistance = 50; // Maximum joystick movement

        joystickBase.addEventListener("touchstart", e => {
            e.preventDefault();
            joyActive = true;
            const rect = joystickBase.getBoundingClientRect();
            joyStart.x = rect.left + rect.width / 2;
            joyStart.y = rect.top + rect.height / 2;
        });

        joystickBase.addEventListener("touchmove", e => {
            e.preventDefault();
            if (!joyActive) return;

            let dx = e.touches[0].clientX - joyStart.x;
            let dy = e.touches[0].clientY - joyStart.y;

            // Limit movement
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > maxDistance) {
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * maxDistance;
                dy = Math.sin(angle) * maxDistance;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            // Update movement keys based on joystick position
            keys.w = dy < -15;
            keys.s = dy > 15;
            keys.a = dx < -15;
            keys.d = dx > 15;
        });

        joystickBase.addEventListener("touchend", e => {
            e.preventDefault();
            joyActive = false;
            joystickKnob.style.transform = "translate(0, 0)";
            keys.w = keys.a = keys.s = keys.d = false;
        });

        /* =====================
           ENEMY
        ===================== */
        const enemies = [];

        function createEnemy(x, y, z) {
            // Enemy body
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 1.8, 0.8),
                new THREE.MeshStandardMaterial({ color: 0xff0000 }) // Red enemy
            );
            body.position.set(x, y, z);
            scene.add(body);

            // Enemy head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xff4444 })
            );
            head.position.set(x, y + 1.2, z);
            scene.add(head);

            const enemy = {
                body: body,
                head: head,
                position: new THREE.Vector3(x, y, z),
                health: 100,
                canShoot: true,
                lastShot: 0,
                speed: 0.05,
                alive: true
            };

            enemies.push(enemy);
            return enemy;
        }

        // Enemy spawn positions inside the castle (15 positions for 15 enemies)
        const enemySpawnPositions = [
            { x: 15, y: 1.6, z: -20 },    // Right front tower
            { x: -15, y: 1.6, z: -20 },   // Left front tower
            { x: 10, y: 1.6, z: -60 },    // Middle right
            { x: -10, y: 1.6, z: -60 },   // Middle left
            { x: 0, y: 1.6, z: -70 },     // Center
            { x: 20, y: 1.6, z: -35 },    // Right house area
            { x: -20, y: 1.6, z: -35 },   // Left house area
            { x: 20, y: 1.6, z: -75 },    // Right back house
            { x: -20, y: 1.6, z: -75 },   // Left back house
            { x: 5, y: 1.6, z: -45 },     // Center middle
            { x: -5, y: 1.6, z: -45 },    // Center middle left
            { x: 0, y: 1.6, z: -30 },     // Front center
            { x: 0, y: 1.6, z: -90 },     // Near main tower
            { x: 25, y: 1.6, z: -95 },    // Right back tower
            { x: -25, y: 1.6, z: -95 }    // Left back tower
        ];

        // Create initial 15 enemies
        enemySpawnPositions.forEach(pos => {
            createEnemy(pos.x, pos.y, pos.z);
        });

        // Function to reset the game
        function resetGame() {
            // Clear all existing enemies
            enemies.forEach(enemy => {
                if (enemy.body) scene.remove(enemy.body);
                if (enemy.head) scene.remove(enemy.head);
            });
            enemies.length = 0;

            // Clear all bullets
            bullets.forEach(b => scene.remove(b));
            bullets.length = 0;
            enemyBullets.forEach(b => scene.remove(b));
            enemyBullets.length = 0;

            // Reset kill counter
            totalKills = 0;
            killCountDisplay.textContent = totalKills;

            // Reset player
            playerHealth = maxHealth;
            healthDisplay.textContent = playerHealth;
            healthDisplay.style.color = 'white';
            player.position.set(0, 1.6, 30);
            player.yaw = 0;
            velocityY = 0;

            // Spawn 15 new enemies
            enemySpawnPositions.forEach(pos => {
                createEnemy(pos.x, pos.y, pos.z);
            });
        }

        /* =====================
           SHOOTING
        ===================== */
        const bullets = [];
        const enemyBullets = [];
        let canShoot = true;

        function shoot() {
            if (!canShoot) return;
            canShoot = false;
            const b = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffff00 })
            );
            b.position.copy(camera.position);
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            b.velocity = dir.multiplyScalar(0.8);
            b.isPlayerBullet = true;
            bullets.push(b);
            scene.add(b);
            setTimeout(() => canShoot = true, 200);
        }

        function enemyShoot(enemy) {
            if (!enemy.canShoot || !enemy.alive) return;
            enemy.canShoot = false;

            const b = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xff0000 }) // Red enemy bullets
            );

            // Set bullet starting position at enemy chest height
            const bulletStart = enemy.position.clone();
            bulletStart.y += 1.0;
            b.position.copy(bulletStart);

            // Calculate direction from bullet position to player center
            const playerCenter = player.position.clone();
            playerCenter.y += 0.9; // Aim at player center (half of player height)

            const dir = new THREE.Vector3();
            dir.subVectors(playerCenter, bulletStart).normalize();
            b.velocity = dir.multiplyScalar(0.5);
            b.isPlayerBullet = false;

            enemyBullets.push(b);
            scene.add(b);

            setTimeout(() => enemy.canShoot = true, 2000); // Enemy shoots every 2 seconds
        }

        shootBtn.onclick = shoot;
        shootBtn.addEventListener("touchstart", e => { e.preventDefault(); shoot(); });
        addEventListener("keydown", e => e.key === "e" && shoot());

        /* =====================
           COLLISION
        ===================== */
        function collides(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(pos.x, pos.y + 0.8, pos.z),
                playerSize
            );
            return colliders.some(o => pBox.intersectsBox(new THREE.Box3().setFromObject(o)));
        }

        // Check if we can step up (for automatic stair climbing)
        function canStepUp(pos, maxStepHeight = 1.2) {
            // Try different step heights
            for (let stepUp = 0.1; stepUp <= maxStepHeight; stepUp += 0.1) {
                const testPos = pos.clone();
                testPos.y += stepUp;

                // If this elevated position is free, we can step up
                if (!collides(testPos)) {
                    return stepUp;
                }
            }
            return 0;
        }

        /* =====================
           GAME LOOP
        ===================== */
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            // Check distance to gate and open/close
            const distanceToGate = Math.sqrt(
                Math.pow(player.position.x - 0, 2) +
                Math.pow(player.position.z - 0, 2)
            );

            if (distanceToGate < 15) {
                gateOpen = true;
            } else {
                gateOpen = false;
            }

            // Animate gate opening/closing
            if (gateOpen && gateOpenProgress < 1) {
                gateOpenProgress += gateSpeed;
                if (gateOpenProgress > 1) gateOpenProgress = 1;
            } else if (!gateOpen && gateOpenProgress > 0) {
                gateOpenProgress -= gateSpeed;
                if (gateOpenProgress < 0) gateOpenProgress = 0;
            }

            // Update gate door positions
            gateLeftDoor.position.x = -2 - (gateOpenProgress * 3);
            gateRightDoor.position.x = 2 + (gateOpenProgress * 3);

            // Check if player is in moat
            isInWater = isInMoat(player.position.x, player.position.y, player.position.z);

            // Drowning mechanic
            if (isInWater) {
                timeInWater += 16.67; // ~60fps = ~16.67ms per frame
                if (timeInWater >= drownTime) {
                    isDrowning = true;
                    // Sink player down
                    velocityY = -0.05;
                }
            } else {
                timeInWater = 0;
                isDrowning = false;
            }

            const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
            const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

            let next = player.position.clone();
            const moveSpeed = isDrowning ? 0 : (isInWater ? speed * 0.4 : speed);
            if (keys.w) next.addScaledVector(forward, -moveSpeed);
            if (keys.s) next.addScaledVector(forward, moveSpeed);
            if (keys.a) next.addScaledVector(right, -moveSpeed);
            if (keys.d) next.addScaledVector(right, moveSpeed);

            // Movement with automatic step climbing
            if (!collides(next)) {
                // No collision, move freely
                player.position.copy(next);
            } else if (onGround) {
                // Hit something while on ground, try to step up
                let stepped = false;
                // Try stepping up in small increments (max 0.6 units for small stairs)
                for (let stepUp = 0.05; stepUp <= 0.6; stepUp += 0.05) {
                    const testPos = next.clone();
                    testPos.y = player.position.y + stepUp;

                    if (!collides(testPos)) {
                        // Found a height where we can move forward
                        player.position.copy(testPos);
                        stepped = true;
                        break;
                    }
                }
                // If can't step up, don't move (blocked by wall)
            }

            // Moat physics - player falls into moat
            if (isOverMoat(player.position.x, player.position.z)) {
                // Player is over moat area, apply gravity to fall in
                if (!isInWater) {
                    velocityY += gravity;
                }
            } else if (isInWater && !isDrowning) {
                // In water but struggling to stay afloat
                velocityY += 0.008; // Weak buoyancy
                velocityY *= 0.85; // Heavy water resistance
            } else if (!isInWater && !isOverMoat(player.position.x, player.position.z)) {
                // Normal ground gravity
                velocityY += gravity;
            }

            player.position.y += velocityY;

            // Update isInWater check after position update
            isInWater = isInMoat(player.position.x, player.position.y, player.position.z);

            // Check if player is on ground OR standing on a collider (like stairs)
            const testBelow = player.position.clone();
            testBelow.y -= 0.1; // Check slightly below

            const isOnCollider = collides(testBelow);
            const isOnGround = player.position.y <= groundY && !isOverMoat(player.position.x, player.position.z);

            if (isOnCollider || isOnGround) {
                // Player is standing on something - stop falling
                if (velocityY < 0) {
                    velocityY = 0;
                }
                onGround = true;

                // If we're falling into ground, snap to ground level
                if (isOnGround && player.position.y < groundY) {
                    player.position.y = groundY;
                }
            } else {
                onGround = false;
            }

            // Drown - sink to bottom and reset
            if (isDrowning && player.position.y < -5) {
                // Show death message
                deathMessage.style.display = 'block';

                setTimeout(() => {
                    deathMessage.style.display = 'none';
                    // Reset player to spawn outside castle (starting position)
                    player.position.set(0, 1.6, 30);
                    player.yaw = 0;
                    velocityY = 0;
                    timeInWater = 0;
                    isDrowning = false;
                    isInWater = false;
                    onGround = true;
                    // Reset health on death by drowning
                    playerHealth = maxHealth;
                    healthDisplay.textContent = playerHealth;
                    healthDisplay.style.color = 'white';
                }, 2000); // Show "YOU DIED" for 2 seconds
            }

            // Enemy AI
            enemies.forEach(enemy => {
                if (!enemy.alive) return;

                // Move towards player
                const distanceToPlayer = enemy.position.distanceTo(player.position);

                if (distanceToPlayer > 3 && distanceToPlayer < 50) {
                    // Move towards player
                    const direction = new THREE.Vector3();
                    direction.subVectors(player.position, enemy.position).normalize();

                    const nextPos = enemy.position.clone();
                    nextPos.x += direction.x * enemy.speed;
                    nextPos.z += direction.z * enemy.speed;

                    // Enhanced collision check for enemies
                    const enemySize = new THREE.Vector3(0.8, 1.8, 0.8);
                    const enemyBox = new THREE.Box3().setFromCenterAndSize(
                        new THREE.Vector3(nextPos.x, nextPos.y + 0.9, nextPos.z),
                        enemySize
                    );

                    let canMove = true;

                    // Check collision with all walls and obstacles
                    for (let collider of colliders) {
                        const colliderBox = new THREE.Box3().setFromObject(collider);
                        if (enemyBox.intersectsBox(colliderBox)) {
                            canMove = false;
                            break;
                        }
                    }

                    // Don't move into moat
                    if (isOverMoat(nextPos.x, nextPos.z)) {
                        canMove = false;
                    }

                    if (canMove) {
                        enemy.position.copy(nextPos);
                        enemy.body.position.copy(nextPos);
                        enemy.head.position.set(nextPos.x, nextPos.y + 1.2, nextPos.z);
                    }
                }

                // Shoot at player
                if (distanceToPlayer < 30) {
                    enemyShoot(enemy);
                }
            });

            // Update player bullets
            bullets.forEach((b, index) => {
                b.position.add(b.velocity);

                // Check collision with enemies
                enemies.forEach((enemy, enemyIndex) => {
                    if (!enemy.alive) return;

                    const dist = b.position.distanceTo(enemy.position);
                    if (dist < 1.0) {
                        enemy.health -= 34; // 3 shots to kill

                        if (enemy.health <= 0) {
                            enemy.alive = false;
                            scene.remove(enemy.body);
                            scene.remove(enemy.head);

                            // Increment kill counter
                            totalKills++;
                            killCountDisplay.textContent = totalKills;

                            // Check if all enemies are killed
                            if (totalKills >= maxEnemies) {
                                // Show win message
                                winMessage.style.display = 'block';

                                setTimeout(() => {
                                    winMessage.style.display = 'none';
                                    // Reset the game
                                    resetGame();
                                }, 3000); // Show "YOU WON!" for 3 seconds
                            }
                        }

                        scene.remove(b);
                        bullets.splice(index, 1);
                    }
                });

                // Remove bullets that are too far
                if (b.position.length() > 200) {
                    scene.remove(b);
                    bullets.splice(index, 1);
                }
            });

            // Update enemy bullets
            enemyBullets.forEach((b, index) => {
                b.position.add(b.velocity);

                // Check collision with player
                const dist = b.position.distanceTo(player.position);
                if (dist < 1.0) {
                    // Player hit - take damage
                    playerHealth -= 20; // Each hit does 20 damage
                    healthDisplay.textContent = playerHealth;

                    // Update health display color
                    if (playerHealth <= 30) {
                        healthDisplay.style.color = 'red';
                    } else if (playerHealth <= 60) {
                        healthDisplay.style.color = 'orange';
                    }

                    scene.remove(b);
                    enemyBullets.splice(index, 1);

                    // Check if player is dead
                    if (playerHealth <= 0) {
                        // Show death message
                        deathMessage.style.display = 'block';

                        setTimeout(() => {
                            deathMessage.style.display = 'none';
                            // Player dies - respawn with full health at starting position
                            playerHealth = maxHealth;
                            healthDisplay.textContent = playerHealth;
                            healthDisplay.style.color = 'white';
                            player.position.set(0, 1.6, 30); // Starting position outside castle
                            player.yaw = 0; // Reset camera to face castle
                            velocityY = 0;
                        }, 2000); // Show "YOU DIED" for 2 seconds
                    }
                }

                // Remove bullets that are too far
                if (b.position.length() > 200) {
                    scene.remove(b);
                    enemyBullets.splice(index, 1);
                }
            });

            camera.rotation.order = "YXZ";
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.position.copy(player.position);

            renderer.render(scene, camera);
        }
        animate();


        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
