<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Shooting Game for History</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            background: black;
        }

        #hint {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            z-index: 10;
        }

        /* MOBILE CONTROLS */
        #shootBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            padding: 20px 30px;
            z-index: 20;
            background: rgba(100, 200, 100, 0.7);
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            display: none;
        }

        #jumpBtn {
            position: fixed;
            bottom: 120px;
            right: 20px;
            font-size: 24px;
            padding: 20px 30px;
            z-index: 20;
            background: rgba(100, 200, 100, 0.7);
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            display: none;
        }

        #joystick-base {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.6);
            border: 5px solid rgba(255, 255, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        #joystick-knob {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 0, 0.95);
            border: 4px solid rgba(255, 255, 255, 1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>

<body>

    <div id="hint">Click to lock mouse • WASD to move • Space to jump • E to shoot • ⚠️ MOAT = DEATH</div>

    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <button id="jumpBtn">Jump</button>
    <button id="shootBtn">Shoot</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        /* =====================
           SETUP
        ===================== */
        // Better mobile detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
            (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);

        console.log("User Agent:", navigator.userAgent);
        console.log("Is Mobile:", isMobile);
        console.log("Max Touch Points:", navigator.maxTouchPoints);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        /* =====================
           LIGHTING
        ===================== */
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        /* =====================
           WORLD + COLLIDERS
        ===================== */
        const colliders = [];

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function wall(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        function house(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        function grass(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        const pyramid = new THREE.Mesh(
            new THREE.ConeGeometry(
                4,    // base radius
                8,    // height
                3     // radial segments (4 = square base)
            ),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
        );

        pyramid.position.set(50, 7, 50);
        scene.add(pyramid);
        colliders.push(pyramid);

        const pyramid1 = new THREE.Mesh(
            new THREE.ConeGeometry(
                4,    // base radius
                8,    // height
                3     // radial segments (4 = square base)
            ),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
        );

        pyramid1.position.set(70, 7, 70);
        scene.add(pyramid1);
        colliders.push(pyramid1);

        const pyramid2 = new THREE.Mesh(
            new THREE.ConeGeometry(
                4,    // base radius
                8,    // height
                3     // radial segments (4 = square base)
            ),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
        );

        pyramid2.position.set(100, 7, 70);
        scene.add(pyramid2);
        colliders.push(pyramid2);

        const pyramid3 = new THREE.Mesh(
            new THREE.ConeGeometry(
                4,    // base radius
                8,    // height
                3     // radial segments (4 = square base)
            ),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
        );

        pyramid3.position.set(-100, 7, 90);
        scene.add(pyramid3);
        colliders.push(pyramid3);

        const pyramid4 = new THREE.Mesh(
            new THREE.ConeGeometry(
                4,    // base radius
                8,    // height
                3     // radial segments (4 = square base)
            ),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
        );

        pyramid4.position.set(-90, 7, -20);
        scene.add(pyramid4);
        colliders.push(pyramid4);

        const pyramid5 = new THREE.Mesh(
            new THREE.ConeGeometry(
                4,    // base radius
                8,    // height
                3     // radial segments (4 = square base)
            ),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
        );

        pyramid5.position.set(-50, 7, 20);
        scene.add(pyramid5);
        colliders.push(pyramid5);

        const pyramid6 = new THREE.Mesh(
            new THREE.ConeGeometry(
                4,    // base radius
                8,    // height
                3     // radial segments (4 = square base)
            ),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
        );

        pyramid6.position.set(0, 7, 50);
        scene.add(pyramid6);
        colliders.push(pyramid6);

        function trunk(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x5D4037 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        // trunk

        trunk(0, 0, 50, 2, 7, 2);
        trunk(-50, 0, 20, 2, 7, 2);
        trunk(100, 0, 70, 2, 7, 2);
        trunk(-90, 0, -20, 2, 7, 2);
        trunk(-100, 0, 90, 2, 7, 2);
        trunk(70, 0, 70, 2, 7, 2);
        trunk(50, 0, 50, 2, 7, 2);


        /* WALLS */
        wall(20, 5, -10, 30, 20, 1);
        wall(-20, 5, -10, 30, 20, 1);
        wall(35, 5, -60, 1, 20, 100);
        wall(-35, 5, -60, 1, 20, 100);
        wall(0, 5, -109, 70, 20, 1);

        // the six towers

        wall(28.5, 5, -25, 15, 30, 1);
        wall(-28.5, 5, -25, 15, 30, 1);
        wall(-35, 5, -17.5, 1, 30, 15);
        wall(35, 5, -17.5, 1, 30, 15);
        wall(-22, 5, -21.5, 1, 30, 7.5);
        wall(22, 5, -21.5, 1, 30, 7.5);
        wall(28.5, 5, -10, 15, 30, 1);
        wall(-28.5, 5, -10, 15, 30, 1);
        wall(-22, 12.5, -17.5, 1, 15, 15);
        wall(22, 12.5, -17.5, 1, 15, 15);

        wall(-28.5, 5, -50, 15, 30, 1);
        wall(28.5, 5, -50, 15, 30, 1);
        wall(-35, 5, -57.5, 1, 30, 15);
        wall(35, 5, -57.5, 1, 30, 15);
        wall(-22, 5, -61, 1, 30, 7.5);
        wall(22, 5, -61, 1, 30, 7.5);
        wall(-28.5, 5, -65, 15, 30, 1);
        wall(28.5, 5, -65, 15, 30, 1);
        wall(-22, 12.5, -57.5, 1, 15, 15);
        wall(22, 12.5, -57.5, 1, 15, 15);

        wall(-28.5, 5, -94, 15, 30, 1);
        wall(28.5, 5, -94, 15, 30, 1);
        wall(-35, 5, -101.5, 1, 30, 15);
        wall(35, 5, -101.5, 1, 30, 15);
        wall(-22, 5, -105, 1, 30, 7.5);
        wall(22, 5, -105, 1, 30, 7.5);
        wall(-28.5, 5, -109, 15, 30, 1);
        wall(28.5, 5, -109, 15, 30, 1);
        wall(22, 12.5, -101, 1, 15, 15);
        wall(-22, 12.5, -101, 1, 15, 15);

        //the main tower
        wall(0, 0, -100, 20, 100, 1);
        wall(-10, 0, -90, 1, 100, 20);
        wall(10, 0, -90, 1, 100, 20);
        wall(-8, 0, -80, 5, 100, 1);
        wall(8, 0, -80, 5, 100, 1);
        wall(0, 30, -80, 12, 40, 1);
        wall(0, 49.5, -77.5, 21, 1, 5);
        wall(0, 50.5, -74.5, 29, 3, 1);
        wall(0, 49.5, -102.5, 21, 1, 5);
        wall(0, 50.5, -104.5, 29, 3, 1);
        wall(-11, 49.5, -89.5, 5, 1, 31);
        wall(-14, 50.5, -88.5, 1, 3, 29);
        wall(11, 49.5, -89.5, 5, 1, 31);
        wall(14, 50.5, -88.5, 1, 3, 29);

        /* ---- GRASS ---- */

        grass(-120, 0, -50, 50, 5, 30);
        grass(70, 0, -50, 50, 5, 30);
        grass(100, 0, -80, 50, 5, 40);
        grass(100, 0, -20, 50, 5, 40);
        grass(70, 0, 0, 50, 5, 40);
        grass(100, 0, 80, 50, 5, 40);
        grass(120, 0, 120, 50, 5, 40);
        grass(100, 0, -120, 50, 5, 40);

        /* ---- STAIRS ---- */
        // Simple straight stairs that work
        function createStairs(startX, startY, startZ, direction, numSteps) {
            const stepWidth = 10;
            const stepHeight = 0.5;
            const stepDepth = 2;

            for (let i = 0; i < numSteps; i++) {
                let x = startX;
                let y = startY + (i * stepHeight);
                let z = startZ;

                // Adjust position based on direction
                if (direction === 'north') z -= i * stepDepth;
                else if (direction === 'south') z += i * stepDepth;
                else if (direction === 'east') x += i * stepDepth;
                else if (direction === 'west') x -= i * stepDepth;

                // Create the step
                wall(x, y, z, stepWidth, stepHeight, stepDepth);
            }
        }

        // Create stairs leading up to the main tower
        createStairs(0, 0.5, -75, 'north', 20);  // 20 steps going north toward tower

        /* =====================
           MOAT (ring around castle walls)
        ===================== */
        // Moat water - ring shape (outside castle only)
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x0047ab, // Darker blue for moat
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide
        });

        // Create 4 moat sections around the castle
        // North moat (behind castle)
        const northMoat = new THREE.Mesh(new THREE.PlaneGeometry(100, 20), waterMaterial);
        northMoat.rotation.x = -Math.PI / 2;
        northMoat.position.set(0, 0.05, -120);
        scene.add(northMoat);

        // South moat (in front of castle)
        const southMoat = new THREE.Mesh(new THREE.PlaneGeometry(100, 20), waterMaterial);
        southMoat.rotation.x = -Math.PI / 2;
        southMoat.position.set(0, 0.05, 10);
        scene.add(southMoat);

        // West moat (left side)
        const westMoat = new THREE.Mesh(new THREE.PlaneGeometry(20, 140), waterMaterial);
        westMoat.rotation.x = -Math.PI / 2;
        westMoat.position.set(-45, 0.05, -55);
        scene.add(westMoat);

        // East moat (right side)
        const eastMoat = new THREE.Mesh(new THREE.PlaneGeometry(20, 140), waterMaterial);
        eastMoat.rotation.x = -Math.PI / 2;
        eastMoat.position.set(45, 0.05, -55);
        scene.add(eastMoat);

        /* =====================
           BRIDGE & GATE (castle entrance)
        ===================== */
        // Drawbridge over south moat
        const bridgeMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Brown wood
        const bridge = new THREE.Mesh(
            new THREE.BoxGeometry(12, 0.5, 22),
            bridgeMaterial
        );
        bridge.position.set(0, 0.3, 10);
        scene.add(bridge);

        // Bridge supports
        const support1 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), bridgeMaterial);
        support1.position.set(-5, -1.5, 10);
        scene.add(support1);
        const support2 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), bridgeMaterial);
        support2.position.set(5, -1.5, 10);
        scene.add(support2);

        // Gate (portcullis style)
        const gateMaterial = new THREE.MeshStandardMaterial({ color: 0x2c2c2c }); // Dark gray
        const stoneMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 }); // Stone gray

        // Gate towers (left and right)
        const towerLeft = new THREE.Mesh(
            new THREE.BoxGeometry(4, 12, 20),
            stoneMaterial
        );
        towerLeft.position.set(-6, 6, -1);
        scene.add(towerLeft);
        colliders.push(towerLeft);

        const towerRight = new THREE.Mesh(
            new THREE.BoxGeometry(4, 12, 20),
            stoneMaterial
        );
        towerRight.position.set(6, 6, -1);
        scene.add(towerRight);
        colliders.push(towerRight)

        // Gate arch
        const archTop = new THREE.Mesh(
            new THREE.BoxGeometry(12, 2, 2),
            stoneMaterial
        );
        archTop.position.set(0, 10, -1);
        scene.add(archTop);

        // Wooden gate doors
        const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x5D4037 }); // Dark wood
        const gateLeftDoor = new THREE.Mesh(
            new THREE.BoxGeometry(4, 7, 0.5),
            woodMaterial
        );
        gateLeftDoor.position.set(-2, 3.5, 0);
        scene.add(gateLeftDoor);

        const gateRightDoor = new THREE.Mesh(
            new THREE.BoxGeometry(4, 7, 0.5),
            woodMaterial
        );
        gateRightDoor.position.set(2, 3.5, 0);
        scene.add(gateRightDoor);

        // Gate state for animation
        let gateOpen = false;
        let gateOpenProgress = 0; // 0 = closed, 1 = fully open
        const gateSpeed = 0.03;

        // Metal reinforcements on doors
        const metalMaterial = new THREE.MeshStandardMaterial({ color: 0x3c3c3c });
        for (let i = 0; i < 3; i++) {
            // Left door reinforcements
            const metalLeft = new THREE.Mesh(
                new THREE.BoxGeometry(4.2, 0.3, 0.3),
                metalMaterial
            );
            metalLeft.position.set(-2, 1.5 + i * 2, 0.3);
            scene.add(metalLeft);

            // Right door reinforcements
            const metalRight = new THREE.Mesh(
                new THREE.BoxGeometry(4.2, 0.3, 0.3),
                metalMaterial
            );
            metalRight.position.set(2, 1.5 + i * 2, 0.3);
            scene.add(metalRight);
        }

        // Tower battlements (crenellations)
        for (let side = -1; side <= 1; side += 2) {
            for (let i = 0; i < 3; i++) {
                const battlement = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 1.5, 1),
                    stoneMaterial
                );
                battlement.position.set(side * 6 + (i - 1) * 1.2, 12.5, -1);
                scene.add(battlement);
            }
        }

        // Moat bounds - only the outer ring (excluding bridge area)
        function isInMoat(x, y, z) {
            // Bridge safe zone (no drowning on bridge)
            if (z >= 0 && z <= 21 && x >= -6 && x <= 6) return false;

            // North moat
            if (z >= -130 && z <= -110 && x >= -50 && x <= 50) return true;
            // South moat (with bridge gap)
            if (z >= 0 && z <= 20 && x >= -50 && x <= 50) return true;
            // West moat
            if (x >= -55 && x <= -35 && z >= -125 && z <= 15) return true;
            // East moat
            if (x >= 35 && x <= 55 && z >= -125 && z <= 15) return true;

            return false;
        }

        // Check if player is over moat area (for falling in)
        function isOverMoat(x, z) {
            // Bridge safe zone
            if (z >= 0 && z <= 21 && x >= -6 && x <= 6) return false;

            // North moat
            if (z >= -130 && z <= -110 && x >= -50 && x <= 50) return true;
            // South moat (with bridge gap)
            if (z >= 0 && z <= 20 && x >= -50 && x <= 50) return true;
            // West moat
            if (x >= -55 && x <= -35 && z >= -125 && z <= 15) return true;
            // East moat
            if (x >= 35 && x <= 55 && z >= -125 && z <= 15) return true;

            return false;
        }

        // Drowning mechanic
        let timeInWater = 0;
        const drownTime = 3000; // 3 seconds to drown

        /* =====================
           PLAYER
        ===================== */
        const player = {
            position: new THREE.Vector3(0, 1.6, 5),
            yaw: 0,
            pitch: 0
        };
        camera.position.copy(player.position);

        const playerSize = new THREE.Vector3(0.8, 1.8, 0.8);

        /* Jump & Swimming */
        let velocityY = 0;
        const gravity = -0.015;
        const jumpStrength = 0.3;
        const groundY = 1.6;
        let onGround = true;
        let isInWater = false;
        let isDrowning = false;

        /* =====================
           INPUT
        ===================== */
        const keys = {};

        addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === "Space" && onGround) {
                velocityY = jumpStrength;
                onGround = false;
            }
        });
        addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        if (!isMobile) {
            document.body.onclick = () => document.body.requestPointerLock();
        }

        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== document.body) return;
            player.yaw -= e.movementX * 0.002;
            player.pitch -= e.movementY * 0.002;
            player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
        });

        /* =====================
           MOBILE CONTROLS
        ===================== */
        const joystickBase = document.getElementById("joystick-base");
        const joystickKnob = document.getElementById("joystick-knob");
        const jumpBtn = document.getElementById("jumpBtn");

        if (isMobile) {
            joystickBase.style.display = "flex";
            jumpBtn.style.display = "block";
            shootBtn.style.display = "block";

            // Force visibility debugging
            console.log("Mobile detected!");
            console.log("Joystick element:", joystickBase);
            console.log("Joystick display:", getComputedStyle(joystickBase).display);

            // Ensure visibility
            setTimeout(() => {
                joystickBase.style.display = "flex";
                joystickBase.style.visibility = "visible";
                jumpBtn.style.display = "block";
                shootBtn.style.display = "block";
                console.log("Joystick forced visible");
            }, 100);
        }

        // Jump button for mobile
        jumpBtn.addEventListener("touchstart", e => {
            e.preventDefault();
            if (onGround) {
                velocityY = jumpStrength;
                onGround = false;
            }
        });

        /* CAMERA ROTATION FOR MOBILE */
        let lastTouchX = 0;
        let lastTouchY = 0;
        let touchRotating = false;

        renderer.domElement.addEventListener("touchstart", e => {
            if (e.touches.length === 1) {
                // Single finger touch for camera rotation
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                touchRotating = true;
            }
        });

        renderer.domElement.addEventListener("touchmove", e => {
            if (touchRotating && e.touches.length === 1) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - lastTouchX;
                const deltaY = touch.clientY - lastTouchY;

                // Update camera rotation (yaw and pitch)
                player.yaw -= deltaX * 0.005;
                player.pitch -= deltaY * 0.005;
                player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            }
        });

        renderer.domElement.addEventListener("touchend", e => {
            if (e.touches.length === 0) {
                touchRotating = false;
            }
        });

        /* JOYSTICK */
        let joyStart = { x: 0, y: 0 }, joyActive = false;
        const maxDistance = 50; // Maximum joystick movement

        joystickBase.addEventListener("touchstart", e => {
            e.preventDefault();
            joyActive = true;
            const rect = joystickBase.getBoundingClientRect();
            joyStart.x = rect.left + rect.width / 2;
            joyStart.y = rect.top + rect.height / 2;
        });

        joystickBase.addEventListener("touchmove", e => {
            e.preventDefault();
            if (!joyActive) return;

            let dx = e.touches[0].clientX - joyStart.x;
            let dy = e.touches[0].clientY - joyStart.y;

            // Limit movement
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > maxDistance) {
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * maxDistance;
                dy = Math.sin(angle) * maxDistance;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            // Update movement keys based on joystick position
            keys.w = dy < -15;
            keys.s = dy > 15;
            keys.a = dx < -15;
            keys.d = dx > 15;
        });

        joystickBase.addEventListener("touchend", e => {
            e.preventDefault();
            joyActive = false;
            joystickKnob.style.transform = "translate(0, 0)";
            keys.w = keys.a = keys.s = keys.d = false;
        });

        /* =====================
           SHOOTING
        ===================== */
        const bullets = [];
        let canShoot = true;

        function shoot() {
            if (!canShoot) return;
            canShoot = false;
            const b = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffff00 })
            );
            b.position.copy(camera.position);
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            b.velocity = dir.multiplyScalar(0.8);
            bullets.push(b);
            scene.add(b);
            setTimeout(() => canShoot = true, 200);
        }

        shootBtn.onclick = shoot;
        shootBtn.addEventListener("touchstart", e => { e.preventDefault(); shoot(); });
        addEventListener("keydown", e => e.key === "e" && shoot());

        /* =====================
           COLLISION
        ===================== */
        function collides(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(pos.x, pos.y + 0.8, pos.z),
                playerSize
            );
            return colliders.some(o => pBox.intersectsBox(new THREE.Box3().setFromObject(o)));
        }

        // Check if we can step up (for automatic stair climbing)
        function canStepUp(pos, maxStepHeight = 1.2) {
            // Try different step heights
            for (let stepUp = 0.1; stepUp <= maxStepHeight; stepUp += 0.1) {
                const testPos = pos.clone();
                testPos.y += stepUp;

                // If this elevated position is free, we can step up
                if (!collides(testPos)) {
                    return stepUp;
                }
            }
            return 0;
        }

        /* =====================
           GAME LOOP
        ===================== */
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            // Check distance to gate and open/close
            const distanceToGate = Math.sqrt(
                Math.pow(player.position.x - 0, 2) +
                Math.pow(player.position.z - 0, 2)
            );

            if (distanceToGate < 15) {
                gateOpen = true;
            } else {
                gateOpen = false;
            }

            // Animate gate opening/closing
            if (gateOpen && gateOpenProgress < 1) {
                gateOpenProgress += gateSpeed;
                if (gateOpenProgress > 1) gateOpenProgress = 1;
            } else if (!gateOpen && gateOpenProgress > 0) {
                gateOpenProgress -= gateSpeed;
                if (gateOpenProgress < 0) gateOpenProgress = 0;
            }

            // Update gate door positions
            gateLeftDoor.position.x = -2 - (gateOpenProgress * 3);
            gateRightDoor.position.x = 2 + (gateOpenProgress * 3);

            // Check if player is in moat
            isInWater = isInMoat(player.position.x, player.position.y, player.position.z);

            // Drowning mechanic
            if (isInWater) {
                timeInWater += 16.67; // ~60fps = ~16.67ms per frame
                if (timeInWater >= drownTime) {
                    isDrowning = true;
                    // Sink player down
                    velocityY = -0.05;
                }
            } else {
                timeInWater = 0;
                isDrowning = false;
            }

            const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
            const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

            let next = player.position.clone();
            const moveSpeed = isDrowning ? 0 : (isInWater ? speed * 0.4 : speed);
            if (keys.w) next.addScaledVector(forward, -moveSpeed);
            if (keys.s) next.addScaledVector(forward, moveSpeed);
            if (keys.a) next.addScaledVector(right, -moveSpeed);
            if (keys.d) next.addScaledVector(right, moveSpeed);

            // Movement with automatic step climbing
            if (!collides(next)) {
                // No collision, move freely
                player.position.copy(next);
            } else if (onGround) {
                // Hit something, try to step up
                const stepHeight = canStepUp(next);
                if (stepHeight > 0) {
                    // Can step up, do it smoothly
                    next.y += stepHeight;
                    player.position.copy(next);
                }
                // If can't step up, just don't move (blocked)
            }

            // Moat physics - player falls into moat
            if (isOverMoat(player.position.x, player.position.z)) {
                // Player is over moat area, apply gravity to fall in
                if (!isInWater) {
                    velocityY += gravity;
                }
            } else if (isInWater && !isDrowning) {
                // In water but struggling to stay afloat
                velocityY += 0.008; // Weak buoyancy
                velocityY *= 0.85; // Heavy water resistance
            } else if (!isInWater && !isOverMoat(player.position.x, player.position.z)) {
                // Normal ground gravity
                velocityY += gravity;
            }

            player.position.y += velocityY;

            // Update isInWater check after position update
            isInWater = isInMoat(player.position.x, player.position.y, player.position.z);

            if (player.position.y <= groundY && !isOverMoat(player.position.x, player.position.z)) {
                player.position.y = groundY;
                velocityY = 0;
                onGround = true;
            } else {
                onGround = false;
            }

            // Drown - sink to bottom and reset
            if (isDrowning && player.position.y < -5) {
                // Reset player to spawn
                player.position.set(0, 1.6, 5);
                velocityY = 0;
                timeInWater = 0;
                isDrowning = false;
                isInWater = false;
                onGround = true;
            }

            bullets.forEach(b => b.position.add(b.velocity));

            camera.rotation.order = "YXZ";
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.position.copy(player.position);

            renderer.render(scene, camera);
        }
        animate();

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>

</html>
