<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Shooting Game for History</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            background: black;
        }

        #hint {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            z-index: 10;
        }

        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: none;
            z-index: 20;
        }

        #mobile-controls button,
        #shootBtn {
            font-size: 28px;
            padding: 18px;
            margin: 5px;
            opacity: 0.7;
            border-radius: 8px;
        }

        #shootBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
        }
    </style>
</head>

<body>

    <div id="hint">Click to lock mouse • WASD to move • E to shoot</div>

    <div id="mobile-controls">
        <button id="up">▲</button><br>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
    </div>

    <button id="shootBtn">Shoot</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        /* =====================
           DEVICE DETECTION
        ===================== */
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        /* =====================
           BASIC SETUP
        ===================== */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(
            75, window.innerWidth / window.innerHeight, 0.1, 1000
        );

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        /* =====================
           LIGHTING
        ===================== */
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        /* =====================
           WORLD
        ===================== */
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function wall(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            m.position.set(x, y, z);
            scene.add(m);
        }

        wall(20, 5, -10, 30, 20, 1);
        wall(-20, 5, -10, 30, 20, 1);
        wall(35, 5, -60, 1, 20, 100);
        wall(-35, 5, -60, 1, 20, 100);
        wall(0, 5, -109, 70, 20, 1);
        wall(28.5, 5, -25, 15, 20, 1);


        /* =====================
           PLAYER
        ===================== */
        const player = {
            position: new THREE.Vector3(0, 1.6, 5),
            yaw: 0,
            pitch: 0
        };

        camera.position.copy(player.position);

        /* =====================
           INPUT
        ===================== */
        const keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // Desktop mouse look
        if (!isMobile) {
            document.body.addEventListener("click", () => {
                document.body.requestPointerLock();
            });

            document.addEventListener("mousemove", e => {
                if (document.pointerLockElement !== document.body) return;
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
            });
        }

        /* =====================
           MOBILE BUTTONS
        ===================== */
        if (isMobile) {
            document.getElementById("mobile-controls").style.display = "block";
            document.getElementById("hint").innerText =
                "Drag to look • Buttons to move";

            // show optional gyro enable button for devices that support DeviceOrientation
            if (window.DeviceOrientationEvent) {
                const g = document.createElement('button');
                g.id = 'gyro';
                g.textContent = 'Enable gyro';
                g.style.position = 'fixed';
                g.style.bottom = '20px';
                g.style.right = '20px';
                g.style.zIndex = '30';
                g.style.padding = '10px 12px';
                g.style.borderRadius = '8px';
                document.body.appendChild(g);
                g.addEventListener('click', enableGyro);
            }
        }

        function bind(id, key) {
            const b = document.getElementById(id);
            if (!b) return;

            const down = (e) => {
                if (e && typeof e.preventDefault === 'function') e.preventDefault();
                keys[key] = true;
            };

            const up = (e) => {
                if (e && typeof e.preventDefault === 'function') e.preventDefault();
                keys[key] = false;
            };

            // Pointer events (preferred)
            b.addEventListener('pointerdown', down);
            b.addEventListener('pointerup', up);
            b.addEventListener('pointercancel', up);

            // Touch fallback
            b.addEventListener('touchstart', down, { passive: false });
            b.addEventListener('touchend', up);
            b.addEventListener('touchcancel', up);

            // Mouse fallback
            b.addEventListener('mousedown', down);
            b.addEventListener('mouseup', up);
            b.addEventListener('mouseleave', up);

            // Prevent default click behaviour which can steal focus/trigger navigation
            b.addEventListener('click', (e) => { e.preventDefault(); });
        }

        bind("up", "w");
        bind("down", "s");
        bind("left", "a");
        bind("right", "d");

        /* =====================
           TOUCH LOOK (mobile)
           use non-passive listener so we can call preventDefault()
        ===================== */
        let lastX = 0, lastY = 0;
        document.addEventListener("touchstart", e => {
            // don't let the browser interpret this touch as a scroll/gesture
            if (e.touches && e.touches[0]) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.addEventListener("touchmove", e => {
            // prevent page scrolling while dragging to look
            e.preventDefault();
            const t = e.touches[0];
            player.yaw -= (t.clientX - lastX) * 0.005;
            player.pitch -= (t.clientY - lastY) * 0.005;
            player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
            lastX = t.clientX;
            lastY = t.clientY;
        }, { passive: false });

        /* =====================
           OPTIONAL DEVICE ORIENTATION (GYRO) FOR MOBILE
           - Requests permission on iOS (if required)
           - Maps device orientation to camera yaw/pitch
        ===================== */
        let usingGyro = false;

        function enableGyro() {
            // iOS 13+ requires permission prompt
            const button = document.getElementById('gyro');
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', onDeviceOrientation, true);
                            usingGyro = true;
                            if (button) button.style.display = 'none';
                        }
                    })
                    .catch(() => {
                        // permission denied or error
                        if (button) button.textContent = 'Gyro unavailable';
                        setTimeout(() => { if (button) button.style.display = 'none'; }, 2000);
                    });
            } else {
                // non-iOS or older browsers
                window.addEventListener('deviceorientation', onDeviceOrientation, true);
                usingGyro = true;
                if (button) button.style.display = 'none';
            }
        }

        function onDeviceOrientation(e) {
            // alpha = rotation around z (0..360) - use for yaw
            // beta  = rotation around x (-180..180) - use for pitch approximation
            const alpha = e.alpha || 0;
            const beta = e.beta || 0;

            // convert to radians and map to camera controls
            // yaw: negate alpha so device rotation maps to world yaw
            player.yaw = -THREE.Math.degToRad(alpha);

            // pitch: map beta (device front/back tilt) to camera pitch range
            // center beta near 90deg (device held vertically) by subtracting 90deg
            const pitchRad = THREE.Math.degToRad(beta) - (Math.PI / 2);
            player.pitch = Math.max(-1.5, Math.min(1.5, pitchRad));
        }

        /* =====================
           SHOOTING (FIXED)
        ===================== */
        const bullets = [];
        let canShoot = true;
        const fireRate = 200;

        function shoot() {
            if (!canShoot) return;
            canShoot = false;

            const bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffff00 })
            );

            // Spawn at camera (eye)
            bullet.position.copy(camera.position);

            // Get EXACT look direction
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            bullet.velocity = direction.multiplyScalar(0.8);

            bullets.push(bullet);
            scene.add(bullet);

            setTimeout(() => canShoot = true, fireRate);
        }

        // E key shooting
        window.addEventListener("keydown", e => {
            if (e.key.toLowerCase() === "e") shoot();
        });

        // Button shooting
        const shootBtn = document.getElementById("shootBtn");
        shootBtn.addEventListener("click", shoot);
        shootBtn.addEventListener("touchstart", shoot);

        /* =====================
           GAME LOOP
        ===================== */
        const speed = 0.15;

        function animate() {
            requestAnimationFrame(animate);

            const forward = new THREE.Vector3(
                Math.sin(player.yaw), 0, Math.cos(player.yaw)
            );
            const right = new THREE.Vector3(
                Math.cos(player.yaw), 0, -Math.sin(player.yaw)
            );

            if (keys.w) player.position.addScaledVector(forward, -speed);
            if (keys.s) player.position.addScaledVector(forward, speed);
            if (keys.a) player.position.addScaledVector(right, -speed);
            if (keys.d) player.position.addScaledVector(right, speed);

            bullets.forEach(b => b.position.add(b.velocity));

            camera.rotation.order = "YXZ";
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.position.copy(player.position);

            renderer.render(scene, camera);
        }
        animate();

        /* =====================
           RESIZE
        ===================== */
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>

</html>
