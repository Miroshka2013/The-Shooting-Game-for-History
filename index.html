<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Shooting Game for History</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            background: black;
        }

        #hint {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            z-index: 10;
        }

        /* MOBILE CONTROLS */
        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: none;
            z-index: 20;
        }

        #mobile-controls button {
            font-size: 26px;
            padding: 18px;
            margin: 4px;
            opacity: 0.7;
            border-radius: 8px;
        }

        #shootBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            z-index: 20;
        }

        #joystick-base {
            position: fixed;
            left: 20px;
            bottom: 200px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        #joystick-knob {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>

    <div id="hint">Click to lock mouse • WASD to move • Space to jump • E to shoot</div>

    <div id="mobile-controls">
        <button id="up">▲</button><br>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
    </div>

    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <button id="shootBtn">Shoot</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        /* =====================
           SETUP
        ===================== */
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        /* =====================
           LIGHTING
        ===================== */
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        /* =====================
           WORLD + COLLIDERS
        ===================== */
        const colliders = [];

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function wall(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        function grass(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        /* WALLS */
        wall(20, 20, -10, 30, 20, 1);
        wall(-20, 20, -10, 30, 20, 1);
        wall(35, 20, -60, 1, 20, 100);
        wall(-35, 20, -60, 1, 20, 100);
        wall(0, 20, -109, 70, 20, 1);

        wall(28.5, 20, -25, 15, 30, 1);
        wall(-28.5, 20, -25, 15, 30, 1);
        wall(-35, 20, -17.5, 1, 30, 15);
        wall(35, 20, -17.5, 1, 30, 15);
        wall(-22, 20, -21.5, 1, 30, 7.5);
        wall(22, 20, -21.5, 1, 30, 7.5);
        wall(28.5, 20, -10, 15, 30, 1);
        wall(-28.5, 20, -10, 15, 30, 1);

        wall(-28.5, 20, -50, 15, 30, 1);
        wall(28.5, 20, -50, 15, 30, 1);
        wall(-35, 20, -57.5, 1, 30, 15);
        wall(35, 20, -57.5, 1, 30, 15);
        wall(-22, 20, -61, 1, 30, 7.5);
        wall(22, 20, -61, 1, 30, 7.5);
        wall(-28.5, 20, -65, 15, 30, 1);
        wall(28.5, 20, -65, 15, 30, 1);

        wall(-28.5, 20, -94, 15, 30, 1);
        wall(28.5, 20, -94, 15, 30, 1);
        wall(-35, 20, -101.5, 1, 30, 15);
        wall(35, 20, -101.5, 1, 30, 15);
        wall(-22, 20, -105, 1, 30, 7.5);
        wall(22, 20, -105, 1, 30, 7.5);
        wall(-28.5, 20, -109, 15, 30, 1);
        wall(28.5, 20, -109, 15, 30, 1);

        // stairs
        function stairs(x, y, z, steps, stepHeight, stepDepth, stepWidth) {
            for (let i = 0; i < steps; i++) {
                wall(x, y + i * stepHeight, z, stepWidth, stepHeight, stepDepth);
            }
        }

        stairs(-60, 0, -30, 10, 1, 5, 20);
        stairs(60, 0, -80, 10, 2, 5);
        stairs(-60, 0, -80, 10, 2, 5, 20);
        stairs(60, 0, -30, 10, 2, 5);

        /* ---- GRASS ---- */

        grass(0, 5, 0, 15, 100, 100)
        grass(-120, 0, -50, 50, 5, 30);
        grass(70, 0, -50, 50, 5, 30);
        grass(100, 0, -80, 50, 5, 40);
        grass(100, 0, -20, 50, 5, 40);
        grass(70, 0, 0, 50, 5, 40);
        grass(100, 0, 80, 50, 5, 40);
        grass(120, 0, 120, 50, 5, 40);
        grass(100, 0, -120, 50, 5, 40);

        /* =====================
           PLAYER
        ===================== */
        const player = {
            position: new THREE.Vector3(0, 1.6, 5),
            yaw: 0,
            pitch: 0
        };
        camera.position.copy(player.position);

        const playerSize = new THREE.Vector3(0.8, 1.8, 0.8);

        /* Jump */
        let velocityY = 0;
        const gravity = -0.015;
        const jumpStrength = 0.3;
        const groundY = 1.6;
        let onGround = true;

        /* =====================
           INPUT
        ===================== */
        const keys = {};

        addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === "Space" && onGround) {
                velocityY = jumpStrength;
                onGround = false;
            }
        });
        addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        if (!isMobile) {
            document.body.onclick = () => document.body.requestPointerLock();
        }

        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== document.body) return;
            player.yaw -= e.movementX * 0.002;
            player.pitch -= e.movementY * 0.002;
            player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
        });

        /* =====================
           MOBILE CONTROLS
        ===================== */
        const mobileControls = document.getElementById("mobile-controls");
        const joystickBase = document.getElementById("joystick-base");
        const joystickKnob = document.getElementById("joystick-knob");

        if (isMobile) {
            mobileControls.style.display = "block";
            joystickBase.style.display = "flex";
        }

        function bindBtn(id, key) {
            const b = document.getElementById(id);
            b.addEventListener("touchstart", e => { e.preventDefault(); keys[key] = true; });
            b.addEventListener("touchend", e => { e.preventDefault(); keys[key] = false; });
        }
        bindBtn("up", "w");
        bindBtn("down", "s");
        bindBtn("left", "a");
        bindBtn("right", "d");

        /* JOYSTICK */
        let joyStart = { x: 0, y: 0 }, joyActive = false;
        joystickBase.addEventListener("touchstart", e => {
            joyActive = true;
            joyStart.x = e.touches[0].clientX;
            joyStart.y = e.touches[0].clientY;
        });
        joystickBase.addEventListener("touchmove", e => {
            if (!joyActive) return;
            let dx = e.touches[0].clientX - joyStart.x;
            let dy = e.touches[0].clientY - joyStart.y;
            dx = Math.max(-40, Math.min(40, dx));
            dy = Math.max(-40, Math.min(40, dy));
            joystickKnob.style.transform = `translate(${dx}px,${dy}px)`;
            keys.w = dy < -10; keys.s = dy > 10; keys.a = dx < -10; keys.d = dx > 10;
        });
        joystickBase.addEventListener("touchend", () => {
            joyActive = false;
            joystickKnob.style.transform = "translate(0,0)";
            keys.w = keys.a = keys.s = keys.d = false;
        });

        /* =====================
           SHOOTING
        ===================== */
        const bullets = [];
        let canShoot = true;

        function shoot() {
            if (!canShoot) return;
            canShoot = false;
            const b = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffff00 })
            );
            b.position.copy(camera.position);
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            b.velocity = dir.multiplyScalar(0.8);
            bullets.push(b);
            scene.add(b);
            setTimeout(() => canShoot = true, 200);
        }

        shootBtn.onclick = shoot;
        shootBtn.addEventListener("touchstart", e => { e.preventDefault(); shoot(); });
        addEventListener("keydown", e => e.key === "e" && shoot());

        /* =====================
           COLLISION
        ===================== */
        function collides(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(pos.x, pos.y + 0.8, pos.z),
                playerSize
            );
            return colliders.some(o => pBox.intersectsBox(new THREE.Box3().setFromObject(o)));
        }

        /* =====================
           GAME LOOP
        ===================== */
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
            const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

            let next = player.position.clone();
            if (keys.w) next.addScaledVector(forward, -speed);
            if (keys.s) next.addScaledVector(forward, speed);
            if (keys.a) next.addScaledVector(right, -speed);
            if (keys.d) next.addScaledVector(right, speed);
            if (!collides(next)) player.position.copy(next);

            velocityY += gravity;
            player.position.y += velocityY;
            if (player.position.y <= groundY) {
                player.position.y = groundY;
                velocityY = 0;
                onGround = true;
            }

            bullets.forEach(b => b.position.add(b.velocity));

            camera.rotation.order = "YXZ";
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.position.copy(player.position);

            renderer.render(scene, camera);
        }
        animate();

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>

</html>
