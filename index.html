<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Shooting Game for History</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            background: black;
        }

        #hint {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            z-index: 10;
        }

        /* MOBILE CONTROLS */
        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: none;
            z-index: 20;
        }

        #mobile-controls button {
            font-size: 26px;
            padding: 18px;
            margin: 4px;
            opacity: 0.7;
            border-radius: 8px;
        }

        #shootBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
            z-index: 20;
        }

        #joystick-base {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(100, 100, 100, 0.5);
            border: 4px solid rgba(255, 255, 255, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #joystick-knob {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(200, 200, 200, 0.9);
            border: 3px solid rgba(255, 255, 255, 0.9);
        }
    </style>
</head>

<body>

    <div id="hint">Click to lock mouse • WASD to move • Space to jump • E to shoot • ⚠️ MOAT = DEATH</div>

    <div id="mobile-controls">
        <button id="up">▲</button><br>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
    </div>

    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <button id="shootBtn">Shoot</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        /* =====================
           SETUP
        ===================== */
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        /* =====================
           LIGHTING
        ===================== */
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        /* =====================
           WORLD + COLLIDERS
        ===================== */
        const colliders = [];

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function wall(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        function grass(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x3a9d23 })
            );
            m.position.set(x, y, z);
            scene.add(m);
            colliders.push(m);
        }

        /* WALLS */
        wall(20, 5, -10, 30, 20, 1);
        wall(-20, 5, -10, 30, 20, 1);
        wall(35, 5, -60, 1, 20, 100);
        wall(-35, 5, -60, 1, 20, 100);
        wall(0, 5, -109, 70, 20, 1);

        wall(28.5, 5, -25, 15, 30, 1);
        wall(-28.5, 5, -25, 15, 30, 1);
        wall(-35, 5, -17.5, 1, 30, 15);
        wall(35, 5, -17.5, 1, 30, 15);
        wall(-22, 5, -21.5, 1, 30, 7.5);
        wall(22, 5, -21.5, 1, 30, 7.5);
        wall(28.5, 5, -10, 15, 30, 1);
        wall(-28.5, 5, -10, 15, 30, 1);

        wall(-28.5, 5, -50, 15, 30, 1);
        wall(28.5, 5, -50, 15, 30, 1);
        wall(-35, 5, -57.5, 1, 30, 15);
        wall(35, 5, -57.5, 1, 30, 15);
        wall(-22, 5, -61, 1, 30, 7.5);
        wall(22, 5, -61, 1, 30, 7.5);
        wall(-28.5, 5, -65, 15, 30, 1);
        wall(28.5, 5, -65, 15, 30, 1);

        wall(-28.5, 5, -94, 15, 30, 1);
        wall(28.5, 5, -94, 15, 30, 1);
        wall(-35, 5, -101.5, 1, 30, 15);
        wall(35, 5, -101.5, 1, 30, 15);
        wall(-22, 5, -105, 1, 30, 7.5);
        wall(22, 5, -105, 1, 30, 7.5);
        wall(-28.5, 5, -109, 15, 30, 1);
        wall(28.5, 5, -109, 15, 30, 1);

        // stairs
        function stairs(x, y, z, steps, stepHeight, stepDepth, stepWidth) {
            for (let i = 0; i < steps; i++) {
                wall(x, y + i * stepHeight, z, stepWidth, stepHeight, stepDepth);
            }
        }

        stairs(-60, 0, -30, 10, 1, 5, 20);
        stairs(60, 0, -80, 10, 2, 5);
        stairs(-60, 0, -80, 10, 2, 5, 20);
        stairs(60, 0, -30, 10, 2, 5);

        /* ---- GRASS ---- */

        grass(-120, 0, -50, 50, 5, 30);
        grass(70, 0, -50, 50, 5, 30);
        grass(100, 0, -80, 50, 5, 40);
        grass(100, 0, -20, 50, 5, 40);
        grass(70, 0, 0, 50, 5, 40);
        grass(100, 0, 80, 50, 5, 40);
        grass(120, 0, 120, 50, 5, 40);
        grass(100, 0, -120, 50, 5, 40);

        /* =====================
           MOAT (ring around castle walls)
        ===================== */
        // Moat water - ring shape (outside castle only)
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x0047ab, // Darker blue for moat
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide
        });

        // Create 4 moat sections around the castle
        // North moat (behind castle)
        const northMoat = new THREE.Mesh(new THREE.PlaneGeometry(100, 20), waterMaterial);
        northMoat.rotation.x = -Math.PI / 2;
        northMoat.position.set(0, 0.05, -120);
        scene.add(northMoat);

        // South moat (in front of castle)
        const southMoat = new THREE.Mesh(new THREE.PlaneGeometry(100, 20), waterMaterial);
        southMoat.rotation.x = -Math.PI / 2;
        southMoat.position.set(0, 0.05, 10);
        scene.add(southMoat);

        // West moat (left side)
        const westMoat = new THREE.Mesh(new THREE.PlaneGeometry(20, 140), waterMaterial);
        westMoat.rotation.x = -Math.PI / 2;
        westMoat.position.set(-45, 0.05, -55);
        scene.add(westMoat);

        // East moat (right side)
        const eastMoat = new THREE.Mesh(new THREE.PlaneGeometry(20, 140), waterMaterial);
        eastMoat.rotation.x = -Math.PI / 2;
        eastMoat.position.set(45, 0.05, -55);
        scene.add(eastMoat);

        /* =====================
           BRIDGE & GATE (castle entrance)
        ===================== */
        // Drawbridge over south moat
        const bridgeMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Brown wood
        const bridge = new THREE.Mesh(
            new THREE.BoxGeometry(12, 0.5, 22),
            bridgeMaterial
        );
        bridge.position.set(0, 0.3, 10);
        scene.add(bridge);

        // Bridge supports
        const support1 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), bridgeMaterial);
        support1.position.set(-5, -1.5, 10);
        scene.add(support1);
        const support2 = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 1), bridgeMaterial);
        support2.position.set(5, -1.5, 10);
        scene.add(support2);

        // Gate (portcullis style)
        const gateMaterial = new THREE.MeshStandardMaterial({ color: 0x2c2c2c }); // Dark gray
        const stoneMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 }); // Stone gray

        // Gate towers (left and right)
        const towerLeft = new THREE.Mesh(
            new THREE.BoxGeometry(4, 12, 4),
            stoneMaterial
        );
        towerLeft.position.set(-6, 6, -1);
        scene.add(towerLeft);

        const towerRight = new THREE.Mesh(
            new THREE.BoxGeometry(4, 12, 4),
            stoneMaterial
        );
        towerRight.position.set(6, 6, -1);
        scene.add(towerRight);

        // Gate arch
        const archTop = new THREE.Mesh(
            new THREE.BoxGeometry(12, 2, 2),
            stoneMaterial
        );
        archTop.position.set(0, 10, -1);
        scene.add(archTop);

        // Wooden gate doors
        const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x5D4037 }); // Dark wood
        const gateLeftDoor = new THREE.Mesh(
            new THREE.BoxGeometry(4, 7, 0.5),
            woodMaterial
        );
        gateLeftDoor.position.set(-2, 3.5, 0);
        scene.add(gateLeftDoor);

        const gateRightDoor = new THREE.Mesh(
            new THREE.BoxGeometry(4, 7, 0.5),
            woodMaterial
        );
        gateRightDoor.position.set(2, 3.5, 0);
        scene.add(gateRightDoor);

        // Gate state for animation
        let gateOpen = false;
        let gateOpenProgress = 0; // 0 = closed, 1 = fully open
        const gateSpeed = 0.03;

        // Metal reinforcements on doors
        const metalMaterial = new THREE.MeshStandardMaterial({ color: 0x3c3c3c });
        for (let i = 0; i < 3; i++) {
            // Left door reinforcements
            const metalLeft = new THREE.Mesh(
                new THREE.BoxGeometry(4.2, 0.3, 0.3),
                metalMaterial
            );
            metalLeft.position.set(-2, 1.5 + i * 2, 0.3);
            scene.add(metalLeft);

            // Right door reinforcements
            const metalRight = new THREE.Mesh(
                new THREE.BoxGeometry(4.2, 0.3, 0.3),
                metalMaterial
            );
            metalRight.position.set(2, 1.5 + i * 2, 0.3);
            scene.add(metalRight);
        }

        // Tower battlements (crenellations)
        for (let side = -1; side <= 1; side += 2) {
            for (let i = 0; i < 3; i++) {
                const battlement = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 1.5, 1),
                    stoneMaterial
                );
                battlement.position.set(side * 6 + (i - 1) * 1.2, 12.5, -1);
                scene.add(battlement);
            }
        }

        // Moat bounds - only the outer ring (excluding bridge area)
        function isInMoat(x, y, z) {
            // Check if player is at water level or below
            if (y > 1.6) return false;

            // Bridge safe zone (no drowning on bridge)
            if (z >= 0 && z <= 21 && x >= -6 && x <= 6) return false;

            // North moat
            if (z >= -130 && z <= -110 && x >= -50 && x <= 50) return true;
            // South moat (with bridge gap)
            if (z >= 0 && z <= 20 && x >= -50 && x <= 50) return true;
            // West moat
            if (x >= -55 && x <= -35 && z >= -125 && z <= 15) return true;
            // East moat
            if (x >= 35 && x <= 55 && z >= -125 && z <= 15) return true;

            return false;
        }

        // Drowning mechanic
        let timeInWater = 0;
        const drownTime = 3000; // 3 seconds to drown

        /* =====================
           PLAYER
        ===================== */
        const player = {
            position: new THREE.Vector3(0, 1.6, 5),
            yaw: 0,
            pitch: 0
        };
        camera.position.copy(player.position);

        const playerSize = new THREE.Vector3(0.8, 1.8, 0.8);

        /* Jump & Swimming */
        let velocityY = 0;
        const gravity = -0.015;
        const jumpStrength = 0.3;
        const groundY = 1.6;
        let onGround = true;
        let isInWater = false;
        let isDrowning = false;

        /* =====================
           INPUT
        ===================== */
        const keys = {};

        addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === "Space" && onGround) {
                velocityY = jumpStrength;
                onGround = false;
            }
        });
        addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        if (!isMobile) {
            document.body.onclick = () => document.body.requestPointerLock();
        }

        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== document.body) return;
            player.yaw -= e.movementX * 0.002;
            player.pitch -= e.movementY * 0.002;
            player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
        });

        /* =====================
           MOBILE CONTROLS
        ===================== */
        const mobileControls = document.getElementById("mobile-controls");
        const joystickBase = document.getElementById("joystick-base");
        const joystickKnob = document.getElementById("joystick-knob");

        if (isMobile) {
            mobileControls.style.display = "block";
            joystickBase.style.display = "flex";
        }

        function bindBtn(id, key) {
            const b = document.getElementById(id);
            b.addEventListener("touchstart", e => { e.preventDefault(); keys[key] = true; });
            b.addEventListener("touchend", e => { e.preventDefault(); keys[key] = false; });
        }
        bindBtn("up", "w");
        bindBtn("down", "s");
        bindBtn("left", "a");
        bindBtn("right", "d");

        /* JOYSTICK */
        let joyStart = { x: 0, y: 0 }, joyActive = false;
        const maxDistance = 50; // Maximum joystick movement
        
        joystickBase.addEventListener("touchstart", e => {
            e.preventDefault();
            joyActive = true;
            const rect = joystickBase.getBoundingClientRect();
            joyStart.x = rect.left + rect.width / 2;
            joyStart.y = rect.top + rect.height / 2;
        });
        
        joystickBase.addEventListener("touchmove", e => {
            e.preventDefault();
            if (!joyActive) return;
            
            let dx = e.touches[0].clientX - joyStart.x;
            let dy = e.touches[0].clientY - joyStart.y;
            
            // Limit movement
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > maxDistance) {
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * maxDistance;
                dy = Math.sin(angle) * maxDistance;
            }
            
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            // Update movement keys based on joystick position
            keys.w = dy < -15;
            keys.s = dy > 15;
            keys.a = dx < -15;
            keys.d = dx > 15;
        });
        
        joystickBase.addEventListener("touchend", e => {
            e.preventDefault();
            joyActive = false;
            joystickKnob.style.transform = "translate(0, 0)";
            keys.w = keys.a = keys.s = keys.d = false;
        });

        /* =====================
           SHOOTING
        ===================== */
        const bullets = [];
        let canShoot = true;

        function shoot() {
            if (!canShoot) return;
            canShoot = false;
            const b = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffff00 })
            );
            b.position.copy(camera.position);
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            b.velocity = dir.multiplyScalar(0.8);
            bullets.push(b);
            scene.add(b);
            setTimeout(() => canShoot = true, 200);
        }

        shootBtn.onclick = shoot;
        shootBtn.addEventListener("touchstart", e => { e.preventDefault(); shoot(); });
        addEventListener("keydown", e => e.key === "e" && shoot());

        /* =====================
           COLLISION
        ===================== */
        function collides(pos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(pos.x, pos.y + 0.8, pos.z),
                playerSize
            );
            return colliders.some(o => pBox.intersectsBox(new THREE.Box3().setFromObject(o)));
        }

        /* =====================
           GAME LOOP
        ===================== */
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            // Check distance to gate and open/close
            const distanceToGate = Math.sqrt(
                Math.pow(player.position.x - 0, 2) +
                Math.pow(player.position.z - 0, 2)
            );

            if (distanceToGate < 15) {
                gateOpen = true;
            } else {
                gateOpen = false;
            }

            // Animate gate opening/closing
            if (gateOpen && gateOpenProgress < 1) {
                gateOpenProgress += gateSpeed;
                if (gateOpenProgress > 1) gateOpenProgress = 1;
            } else if (!gateOpen && gateOpenProgress > 0) {
                gateOpenProgress -= gateSpeed;
                if (gateOpenProgress < 0) gateOpenProgress = 0;
            }

            // Update gate door positions
            gateLeftDoor.position.x = -2 - (gateOpenProgress * 3);
            gateRightDoor.position.x = 2 + (gateOpenProgress * 3);

            // Check if player is in moat
            isInWater = isInMoat(player.position.x, player.position.y, player.position.z);

            // Drowning mechanic
            if (isInWater) {
                timeInWater += 16.67; // ~60fps = ~16.67ms per frame
                if (timeInWater >= drownTime) {
                    isDrowning = true;
                    // Sink player down
                    velocityY = -0.05;
                }
            } else {
                timeInWater = 0;
                isDrowning = false;
            }

            const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
            const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

            let next = player.position.clone();
            const moveSpeed = isDrowning ? 0 : (isInWater ? speed * 0.4 : speed);
            if (keys.w) next.addScaledVector(forward, -moveSpeed);
            if (keys.s) next.addScaledVector(forward, moveSpeed);
            if (keys.a) next.addScaledVector(right, -moveSpeed);
            if (keys.d) next.addScaledVector(right, moveSpeed);
            if (!collides(next)) player.position.copy(next);

            // Moat physics
            if (isInWater && !isDrowning) {
                // Struggle to stay afloat
                velocityY += 0.008; // Weak buoyancy
                velocityY *= 0.85; // Heavy water resistance
            } else if (!isInWater) {
                velocityY += gravity;
            }

            player.position.y += velocityY;

            if (player.position.y <= groundY && !isInWater) {
                player.position.y = groundY;
                velocityY = 0;
                onGround = true;
            } else {
                onGround = false;
            }

            // Drown - sink to bottom and reset
            if (isDrowning && player.position.y < -5) {
                // Reset player to spawn
                player.position.set(0, 1.6, 5);
                velocityY = 0;
                timeInWater = 0;
                isDrowning = false;
                isInWater = false;
                onGround = true;
            }

            bullets.forEach(b => b.position.add(b.velocity));

            camera.rotation.order = "YXZ";
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.position.copy(player.position);

            renderer.render(scene, camera);
        }
        animate();

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>

</html>
