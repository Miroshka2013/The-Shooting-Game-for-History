<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Shooting Game for History</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
            background: black;
        }

        #hint {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            z-index: 10;
        }

        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: none;
            z-index: 20;
        }

        #mobile-controls button {
            font-size: 22px;
            padding: 14px;
            margin: 5px;
            opacity: 0.7;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div id="hint">Click to lock mouse • WASD to move</div>

    <div id="mobile-controls">
        <button id="up">▲</button><br>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        /* =====================
           DEVICE DETECTION
        ===================== */
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        /* =====================
           BASIC SETUP
        ===================== */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        /* =====================
           LIGHTING
        ===================== */
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(5, 10, 5);
        scene.add(sun);

        /* =====================
           WORLD
        ===================== */
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x3a9d23, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        function wall(x, y, z, w, h, d) {
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            m.position.set(x, y, z);
            scene.add(m);
        }

        wall(8, 5, -10, 10, 10, 1);
        wall(-8, 5, -10, 10, 10, 1);

        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        sphere.position.set(0, 1, -5);
        scene.add(sphere);

        /* =====================
           PLAYER
        ===================== */
        const player = {
            position: new THREE.Vector3(0, 1.6, 5),
            yaw: 0,
            pitch: 0
        };

        camera.position.copy(player.position);

        /* =====================
           INPUT
        ===================== */
        const keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        // Desktop mouse look
        if (!isMobile) {
            document.body.addEventListener("click", () => {
                document.body.requestPointerLock();
            });

            document.addEventListener("mousemove", e => {
                if (document.pointerLockElement !== document.body) return;
                player.yaw -= e.movementX * 0.002;
                player.pitch -= e.movementY * 0.002;
                player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
            });
        }

        // Mobile touch look
        let lastX = 0, lastY = 0;
        document.addEventListener("touchstart", e => {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        document.addEventListener("touchmove", e => {
            const t = e.touches[0];
            player.yaw -= (t.clientX - lastX) * 0.005;
            player.pitch -= (t.clientY - lastY) * 0.005;
            player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
            lastX = t.clientX;
            lastY = t.clientY;
        });

        /* =====================
           MOBILE BUTTONS
        ===================== */
        if (isMobile) {
            document.getElementById("mobile-controls").style.display = "block";
            document.getElementById("hint").innerText =
                "Drag to look • Buttons to move";
        }

        function bind(id, key) {
            const b = document.getElementById(id);
            b.addEventListener("touchstart", () => keys[key] = true);
            b.addEventListener("touchend", () => keys[key] = false);
        }

        bind("up", "w");
        bind("down", "s");
        bind("left", "a");
        bind("right", "d");

        /* =====================
           GAME LOOP
        ===================== */
        const speed = 0.15;

        function animate() {
            requestAnimationFrame(animate);

            const forward = new THREE.Vector3(
                Math.sin(player.yaw), 0, Math.cos(player.yaw)
            );
            const right = new THREE.Vector3(
                Math.cos(player.yaw), 0, -Math.sin(player.yaw)
            );

            if (keys.w) player.position.addScaledVector(forward, -speed);
            if (keys.s) player.position.addScaledVector(forward, speed);
            if (keys.a) player.position.addScaledVector(right, -speed);
            if (keys.d) player.position.addScaledVector(right, speed);

            camera.rotation.order = "YXZ";
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.position.copy(player.position);

            renderer.render(scene, camera);
        }

        animate();

        /* =====================
           RESIZE
        ===================== */
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>

</html>
